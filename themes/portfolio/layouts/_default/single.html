{{ define "main" }}
<div class="container">
    <article class="post">
        <header class="post-header">
            <h1>{{ .Title }}</h1>
            <p class="post-meta">{{ .Date.Format "January 2, 2006" }}</p>
        </header>
        <div class="post-content">
            {{ .Content }}
        </div>
    </article>
</div>
{{ end }}
