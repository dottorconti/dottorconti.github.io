{{ define "main" }}
<div class="hero">
    <div class="container">
        <h1>{{ .Site.Title }}</h1>
        <p class="tagline">{{ .Site.Params.tagline }}</p>
        <div class="hero-links">
            <a href="https://github.com/{{ .Site.Params.github }}" target="_blank" class="btn">GitHub</a>
            <a href="https://github.com/dottorconti?tab=repositories" target="_blank" class="btn btn-primary">View Projects</a>
        </div>
    </div>
</div>

<div class="container">
    <section class="intro">
        {{ .Content }}
    </section>

    <!-- Featured Projects temporaneamente nascosti
    <section class="featured-projects">
        <h2>Featured Projects</h2>
        <div class="projects-grid">
            {{ range first 6 (where .Site.RegularPages "Section" "projects") }}
            <div class="project-card">
                {{ if .Params.image }}
                <img src="{{ .Params.image }}" alt="{{ .Title }}">
                {{ end }}
                <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
                <p>{{ .Summary }}</p>
                {{ if .Params.github }}
                <a href="{{ .Params.github }}" target="_blank" class="project-link">View on GitHub →</a>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </section>
    -->

    <section class="recent-posts">
        <h2>Latest Updates</h2>
        {{ range first 3 (where .Site.RegularPages "Section" "blog") }}
        <article class="post-item">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <p class="post-meta">{{ .Date.Format "January 2, 2006" }}</p>
            <p>{{ .Summary }}</p>
        </article>
        {{ end }}
    </section>
</div>
{{ end }}
